name: Build Atlas Retro

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check project files
        shell: pwsh
        run: |
          $need = @("CMakeLists.txt","Source/PluginProcessor.cpp","Source/PluginProcessor.h","Source/PluginEditor.cpp","Source/PluginEditor.h","Source/Presets.h","installer/AtlasRetro.iss")
          $missing = $need | Where-Object { -not (Test-Path $_) }
          if ($missing) { Write-Error "Nedostaju fajlovi u repou: $($missing -join ', ')"; exit 1 }
          Write-Host "Svi fajlovi postoje."

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Find VST3 folder
        id: find
        shell: pwsh
        run: |
          $dir = Get-ChildItem -Recurse -Directory build -Filter "*.vst3" | Select-Object -First 1
          if (-not $dir) { Write-Error "VST3 nije pronadjen nakon builda"; exit 1 }
          Write-Host "VST3: $($dir.FullName)"
          "vst3=$($dir.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer (.exe)
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DVst3Dir=${{ steps.find.outputs.vst3 }}" "installer\AtlasRetro.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: AtlasRetro-Installer
          path: installer/Output/AtlasRetro_Setup.exe

      - name: Upload plain VST3 (rezerva)
        uses: actions/upload-artifact@v4
        with:
          name: AtlasRetro-VST3-folder
          path: ${{ steps.find.outputs.vst3 }}
